name: Playwright Tests for Jenkins

on:
  workflow_dispatch: {}
  push:
    branches:
      - BO-111-add-playwright-tests

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug repo contents
        working-directory: .
        run: |
          pwd
          echo "--- repo root listing ---"
          ls -la
          echo "--- playwright dir listing (if present) ---"
          ls -la playwright || echo "playwright not found"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test tests/e2e --reporter=list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/test-results
